# MedAlign Backend Standalone Compose
# Recommended: Run 'docker compose up -d' from the root MedAlign directory for full stack (DB, App, Nginx, Mailpit, phpMyAdmin)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medalign_db
      DB_USERNAME: medalign_user
      DB_PASSWORD: medalign_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medalign_db
      MYSQL_USER: medalign_user
      MYSQL_PASSWORD: medalign_password
      MYSQL_ROOT_PASSWORD: medalign_secret
    ports:
      - "3307:3306"
    volumes:
      - medalign_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmedalign_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medalign_mysql:
